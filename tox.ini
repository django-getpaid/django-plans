[tox]
envlist =
    {py311,py312,py313,py314}-django-52
    {py312,py313,py314}-django-60
    {py312,py313,py314}-django-61

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    django-52: Django>=5.2,<5.3
    django-60: Django>=6.0,<6.1
    django-61: Django>=6.1,<6.2
    -r{toxinidir}/demo/requirements.txt
commands_pre =
    python -m pip install -q --build-constraint {toxinidir}/demo/build-constraints.txt django-concurrent-test-helper
changedir=demo
commands=coverage run manage.py test {posargs:plans}
